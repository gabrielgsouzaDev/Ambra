# Postgres local para desenvolvimento.
# Sobe com: npm run db:up  (para: npm run db:down)
services:
  db:
    image: postgres:16-alpine
    container_name: ambra-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ambra
      POSTGRES_PASSWORD: ambra
      POSTGRES_DB: ambra
    ports:
      # Host 5433 → container 5432 (evita conflito com outro Postgres local na 5432).
      - "5433:5432"
    volumes:
      - ambra-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ambra -d ambra"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ambra-db-data:
